<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-labelledby="title">
<title id="title">ARTS Apparel — premium garment logo</title>
<defs>
 <linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ff4b4b"/><stop offset=".48" stop-color="#e00016"/><stop offset="1" stop-color="#8e0010"/></linearGradient>
 <linearGradient id="black" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#555"/><stop offset=".45" stop-color="#050505"/><stop offset="1" stop-color="#242424"/></linearGradient>
 <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".45" stop-color="#aaa"/><stop offset="1" stop-color="#333"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur in="SourceAlpha" stdDeviation="2"/><feOffset dy="2"/><feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<!-- decorative calligraphic A -->
<path d="M25 174 C4 191 4 214 29 218 C55 224 86 195 111 152 C130 119 153 64 188 25 C164 41 137 64 118 91 C95 125 73 168 51 179 C38 186 25 181 25 174Z" fill="url(#black)" stroke="#ddd" stroke-width="2.5" filter="url(#shadow)"/>
<path d="M64 187 C105 193 143 173 176 142 C190 128 203 110 216 88 C197 134 171 172 139 197 C112 218 74 229 38 217" fill="none" stroke="url(#shine)" stroke-width="5" stroke-linecap="round"/>
