    <script>
      (function () {
        function showRuntimeError(message) {
          var panel = document.getElementById("rts-runtime-error");
          if (!panel) {
            panel = document.createElement("pre");
            panel.id = "rts-runtime-error";
            panel.style.cssText = "position:fixed;inset:12px;z-index:2147483647;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;background:#160b0d;color:#fff;padding:18px;border:2px solid #e63946;border-radius:10px;font:13px/1.5 monospace";
            document.addEventListener("DOMContentLoaded", function () {
              if (!panel.isConnected) document.body.appendChild(panel);
            }, { once: true });
            (document.body || document.documentElement).appendChild(panel);
          }
          panel.textContent = "ARTS APPAREL — JavaScript startup error\\n\\n" + String(message);
        }
        window.addEventListener("error", function (event) {
          // Resource load failures (especially product images) are handled by their
          // own onError fallbacks. They are not JavaScript startup exceptions.
          if (event.target && event.target !== window && event.target.tagName !== "SCRIPT") return;
          showRuntimeError((event.error && event.error.stack ? event.error.stack + "\\n" : "") + (event.filename ? event.filename + ":" + event.lineno + ":" + event.colno + "\\n" : "") + (event.message || "Unknown JavaScript error"));
        }, true);
        window.addEventListener("unhandledrejection", function (event) {
          var reason = event.reason;
          showRuntimeError(reason && (reason.stack || reason.message) || reason || "Unhandled promise rejection");
        });
      })();
    </script>
